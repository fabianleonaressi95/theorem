name: Jitterbug eight-coil audit

on:
  push:
    branches: [main]
    paths:
      - "audits/jitterbug_eight_coil_coupling.py"
      - "audits/jitterbug_coil_coupling.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_eight_coil_coupling.py"
      - ".github/workflows/jitterbug-eight-coil.yml"
  pull_request:
    paths:
      - "audits/jitterbug_eight_coil_coupling.py"
      - "audits/jitterbug_coil_coupling.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_eight_coil_coupling.py"
      - ".github/workflows/jitterbug-eight-coil.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eight-coil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy

      - name: Run eight-coil unit tests
        run: python -m unittest tests.test_jitterbug_eight_coil_coupling -v

      - name: Execute reduced-resolution Jitterbug model
        run: |
          python audits/jitterbug_eight_coil_coupling.py \
            --segments 32 \
            --ds 0.1 \
            --output jitterbug-eight-coil-report.json

      - name: Upload numerical report
        uses: actions/upload-artifact@v4
        with:
          name: jitterbug-eight-coil-report
          path: jitterbug-eight-coil-report.json
          if-no-files-found: error
