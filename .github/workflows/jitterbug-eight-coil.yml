name: Jitterbug eight-coil audit

on:
  push:
    branches: [main]
    paths:
      - "audits/jitterbug_eight_coil_coupling.py"
      - "audits/jitterbug_eight_coil_validation.py"
      - "audits/jitterbug_actual_field_dn.py"
      - "audits/jitterbug_coil_coupling.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_eight_coil_coupling.py"
      - "tests/test_jitterbug_eight_coil_validation.py"
      - "tests/test_jitterbug_actual_field_dn.py"
      - "research/JITTERBUG_EIGHT_COIL_VALIDATION.md"
      - "research/JITTERBUG_NEUMANN_DIRICHLET_BRIDGE.md"
      - ".github/workflows/jitterbug-eight-coil.yml"
  pull_request:
    paths:
      - "audits/jitterbug_eight_coil_coupling.py"
      - "audits/jitterbug_eight_coil_validation.py"
      - "audits/jitterbug_actual_field_dn.py"
      - "audits/jitterbug_coil_coupling.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_eight_coil_coupling.py"
      - "tests/test_jitterbug_eight_coil_validation.py"
      - "tests/test_jitterbug_actual_field_dn.py"
      - "research/JITTERBUG_EIGHT_COIL_VALIDATION.md"
      - "research/JITTERBUG_NEUMANN_DIRICHLET_BRIDGE.md"
      - ".github/workflows/jitterbug-eight-coil.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eight-coil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install numerical dependency
        run: python -m pip install --upgrade pip numpy

      - name: Run eight-coil primitive tests
        run: python -m unittest tests.test_jitterbug_eight_coil_coupling -v

      - name: Run coaxial benchmark and driven-flux tests
        run: python -m unittest tests.test_jitterbug_eight_coil_validation -v

      - name: Run actual-motion, finite-surface and energy tests
        run: python -m unittest tests.test_jitterbug_actual_field_dn -v

      - name: Execute independent convergence and driven-flux audit
        run: python audits/jitterbug_eight_coil_validation.py --output jitterbug-eight-coil-validation.json

      - name: Execute actual Gray/Jitterbug finite-surface field model
        run: python audits/jitterbug_actual_field_dn.py --ds 0.08 --segments 48 --output jitterbug-actual-field-dn-report.json

      - name: Execute reduced-resolution eight-coil model
        run: python audits/jitterbug_eight_coil_coupling.py --segments 32 --ds 0.1 --output jitterbug-eight-coil-report.json

      - name: Upload all numerical reports
        uses: actions/upload-artifact@v4
        with:
          name: jitterbug-eight-coil-complete-audit
          path: |
            jitterbug-eight-coil-report.json
            jitterbug-eight-coil-validation.json
            jitterbug-actual-field-dn-report.json
          if-no-files-found: error
          retention-days: 90
