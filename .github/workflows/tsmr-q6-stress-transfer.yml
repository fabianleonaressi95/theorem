name: Q6 pair-transfer stress bridge audit

on:
  push:
    paths:
      - "audits/tsmr_q6_stress_transfer_bridge.py"
      - "audits/tsmr_c_iching_overlap_automaton.py"
      - "audits/tsmr_c_iching_q6.py"
      - ".github/workflows/tsmr-q6-stress-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair-transfer-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-state transfer audit
        run: python audits/tsmr_q6_stress_transfer_bridge.py
