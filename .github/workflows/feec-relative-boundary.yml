name: FEEC relative boundary and codifferential audit

on:
  push:
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/feec-relative-boundary.yml"
  pull_request:
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/feec-relative-boundary.yml"
  workflow_dispatch:

jobs:
  feec-relative-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FEEC numerical and test dependencies
        run: python -m pip install --upgrade pytest numpy scipy
      - name: Run relative-boundary and FEEC regression tests
        working-directory: projects/de_rham_benchmark
        run: python -m pytest -q test_boundary_complex.py test_feec_study.py
      - name: Reproduce relative codifferential refinement study
        if: always()
        working-directory: projects/de_rham_benchmark
        run: python run_relative_codifferential_study.py --levels 4 8 16 --output reports/relative_codifferential.json
      - name: Upload relative codifferential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relative-codifferential-study
          path: projects/de_rham_benchmark/reports/relative_codifferential.json
