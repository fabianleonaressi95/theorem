name: Pellis document 1 — exact A1 scalar spectrum

on:
  push:
    branches:
      - main
      - "collaboration/pellis-document-1-spectral-foundation"
      - "document-a/exact-poincare-spectrum"
    paths:
      - ".github/workflows/document-a1-spectrum.yml"
      - "tests/test_a1_poincare_scalar_spectrum.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/document-a1-spectrum.yml"
      - "tests/test_a1_poincare_scalar_spectrum.py"
      - "theorems/T035-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pellis-document-a1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a1-spectrum:
    name: A1 exact scalar spectrum regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run A1 scalar spectrum regression
        run: python -m unittest tests.test_a1_poincare_scalar_spectrum -v
