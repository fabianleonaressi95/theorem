name: Exact scalar spectrum and T035 group model

on:
  push:
    branches:
      - main
      - "document-a/exact-poincare-spectrum"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-arithmetic dependencies
        run: python -m pip install --disable-pip-version-check sympy
      - name: Run A1 exact character/Molien regression
        run: python -m unittest tests.test_a1_poincare_scalar_spectrum -v
      - name: Run T035 exact binary icosahedral group regression
        run: python -m unittest tests.test_t035_exact_binary_icosahedral_model -v
      - name: Run T035 audit and print JSON report
        run: python audits/t035_exact_binary_icosahedral_model.py
