name: T155 dodecahedral Levi-Civita and covariant Hodge audit
on:
  push:
    paths:
      - "scripts/audit_t155_dodecahedral_levi_civita_hodge.py"
      - "tests/test_t155_dodecahedral_levi_civita_hodge.py"
      - ".github/workflows/t155-levi-civita-hodge.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python scripts/audit_t155_dodecahedral_levi_civita_hodge.py
      - run: python -m unittest tests.test_t155_dodecahedral_levi_civita_hodge
      - uses: actions/upload-artifact@v4
        with:
          name: t155-levi-civita-hodge-report
          path: results/json/t155_dodecahedral_levi_civita_hodge.json
          retention-days: 30
