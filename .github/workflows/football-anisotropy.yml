name: Football geometry and RGS transfer audit

on:
  push:
    branches: [main]
    paths:
      - "models/football_*.py"
      - "models/discrete_incompatibility_weak.py"
      - "scripts/*football*.py"
      - "tests/test_*football*.py"
      - "tests/test_discrete_incompatibility_weak.py"
      - "models/tangent_triplet_anisotropy.py"
      - "models/football_bundle_connection.py"
      - "tests/test_football_bundle_connection.py"
      - "tests/test_rgs_shell_tangent_fibre_transfer.py"
      - "tests/test_reconstruct_rgs_t2u_triplet.py"
      - "scripts/reconstruct_rgs_t2u_triplet.py"
      - "scripts/audit_rgs_shell_tangent_fibre_transfer.py"
      - "docs/*FOOTBALL*.md"
      - "docs/*football*.md"
      - "manuscripts/*CALCISTICO*.md"
      - "data/rgs_188d/X_Oh_reconstructed.csv"
      - ".github/workflows/football-anisotropy.yml"
  pull_request:
    paths:
      - "models/football_*.py"
      - "models/discrete_incompatibility_weak.py"
      - "scripts/*football*.py"
      - "tests/test_*football*.py"
      - "tests/test_discrete_incompatibility_weak.py"
      - "models/tangent_triplet_anisotropy.py"
      - "tests/test_rgs_shell_tangent_fibre_transfer.py"
      - "tests/test_reconstruct_rgs_t2u_triplet.py"
      - "scripts/reconstruct_rgs_t2u_triplet.py"
      - "scripts/audit_rgs_shell_tangent_fibre_transfer.py"
      - "docs/*FOOTBALL*.md"
      - "docs/*football*.md"
      - "manuscripts/*CALCISTICO*.md"
      - "data/rgs_188d/X_Oh_reconstructed.csv"
      - ".github/workflows/football-anisotropy.yml"
  workflow_dispatch:

concurrency:
  group: football-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  football-audit:
    name: Geometry, mechanics, quaternion and RGS transfer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest

      - name: Run focused geometry and mechanics tests
        run: |
          python -m pytest -q \
            tests/test_football_anisotropy.py \
            tests/test_football_geometric_transfer.py \
            tests/test_football_quaternion_bridge.py \
            tests/test_football_quaternion_tangent.py \
            tests/test_football_seam_law.py \
            tests/test_rgs_football_triplet_spectral_comparison.py \
            tests/test_discrete_incompatibility_weak.py \
            tests/test_rgs_shell_tangent_fibre_transfer.py \
            tests/test_reconstruct_rgs_t2u_triplet.py \
            tests/test_football_bundle_connection.py

      - name: Build RGS-to-football geometric transfer
        run: python scripts/build_rgs_football_geometric_transfer.py

      - name: Run RGS rotational-triplet comparison
        run: python scripts/run_rgs_football_triplet_spectral_comparison.py

      - name: Run and save transfer robustness audit
        run: |
          python scripts/audit_rgs_football_transfer_robustness.py \
            --out reports/rgs_football_transfer_robustness.json

      - name: Reconstruct the original Q6 T2u first triplet
        run: python scripts/reconstruct_rgs_t2u_triplet.py

      - name: Upload numerical audit reports
        uses: actions/upload-artifact@v4
        with:
          name: football-rgs-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/rgs_football_transfer_robustness.json
            reports/rgs_football_transfer_robustness.npz
            reports/rgs_q6_t2u_first_triplet.npy
            reports/rgs_q6_t2u_first_triplet.npz
            reports/rgs_q6_t2u_reconstruction.json
          if-no-files-found: error
          retention-days: 14
