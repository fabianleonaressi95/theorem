name: Morandotti two-core P3 C0-IPDG audit

on:
  push:
    branches:
      - main
      - 'work/rgs-defect-benchmark-torino'
      - 'work/morandotti-cell-reconstruction'
      - 'fix/morandotti-actions-triggers'
    paths:
      - 'models/morandotti_cell_reconstruction.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'tests/test_morandotti_cell_reconstruction.py'
      - '.github/workflows/morandotti-two-core-c0-ipdg.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'models/morandotti_cell_reconstruction.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'tests/test_morandotti_cell_reconstruction.py'
      - '.github/workflows/morandotti-two-core-c0-ipdg.yml'
  workflow_dispatch:

concurrency:
  group: morandotti-two-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  two-core-p3-c0-ipdg:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Gmsh Python bindings
        run: |
          set -euo pipefail

          # GitHub-hosted container networking can briefly lose DNS resolution.
          # Retry apt metadata refresh instead of failing on the first resolver hiccup.
          for attempt in 1 2 3 4 5; do
            if apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::apt-get update failed after 5 attempts; DNS diagnostics follow."
              getent hosts security.ubuntu.com || true
              getent hosts archive.ubuntu.com || true
              cat /etc/resolv.conf || true
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          apt-get -o Acquire::Retries=3 install -y --no-install-recommends libglu1-mesa
          python3 -m pip install --retries 5 --timeout 30 --break-system-packages gmsh pytest

      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('Gmsh', gmsh.__version__)"
          python3 -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"

      - name: Run Morandotti algebraic reconstruction tests
        run: python3 -m pytest -q tests/test_morandotti_cell_reconstruction.py

      - name: Run two-core six-field interaction audit
        run: |
          python3 scripts/rgs_morandotti_two_core_c0_ipdg.py \
            --mesh-sizes 0.08 0.06 \
            --alpha 10 \
            --young-modulus 1.0 \
            --poisson-ratio 0.0 \
            --out artifacts/morandotti_two_core/report.json

      - name: Upload two-core report and FE fields
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-two-core-p3-c0-ipdg-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/morandotti_two_core/
          if-no-files-found: error
          retention-days: 14
