name: Morandotti two-core P3 C0-IPDG audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'models/morandotti_cell_reconstruction.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'tests/test_morandotti_cell_reconstruction.py'
      - '.github/workflows/morandotti-two-core-c0-ipdg.yml'
  workflow_dispatch:

concurrency:
  group: morandotti-two-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  two-core-p3-c0-ipdg:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('Gmsh', gmsh.__version__)"
          python3 -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"

      - name: Run Morandotti algebraic reconstruction tests
        run: python3 -m pytest -q tests/test_morandotti_cell_reconstruction.py

      - name: Run two-core six-field interaction audit
        run: |
          python3 scripts/rgs_morandotti_two_core_c0_ipdg.py \
            --mesh-sizes 0.08 0.06 0.045 0.035 0.027 \
            --alpha 10 \
            --young-modulus 1.0 \
            --poisson-ratio 0.0 \
            --out artifacts/morandotti_two_core/report.json

      - name: Validate explicit Frank-Burgers traction refinement report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/morandotti_two_core/report.json").read_text())
          summary = report["traction_jump_refinement"]
          levels = summary["levels"]
          expected_h = [0.08, 0.06, 0.045, 0.035, 0.027]
          assert len(levels) == len(expected_h), (len(levels), expected_h)
          for level, h in zip(levels, expected_h):
              assert abs(level["h_target"] - h) < 1e-12, (level["h_target"], h)
              assert level["cases"], "missing reconstruction cases"
              for name, case in level["cases"].items():
                  f = case["J_F_squared"]
                  b = case["J_B_squared"]
                  cross = case["J_FB"]
                  total = case["J_total_squared"]
                  residual = case["additivity_residual"]
                  scale = max(abs(total), 1e-300)
                  assert abs(total - f - b - cross) <= 1e-10 * scale, (h, name, total, f, b, cross)
                  assert abs(residual) <= 1e-10 * scale, (h, name, residual, scale)
          assert len(summary["convergence"]) == len(expected_h) - 1
          print("Validated Frank/Burgers traction decomposition at all five mesh levels.")
          PY

      - name: Upload two-core report and FE fields
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-two-core-p3-c0-ipdg-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/morandotti_two_core/
          if-no-files-found: error
          retention-days: 14
