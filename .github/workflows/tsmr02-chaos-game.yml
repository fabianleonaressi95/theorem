name: TSMR-02 chaos-game tests

on:
  pull_request:
    paths:
      - "audits/tsmr02_chaos_game.py"
      - "tests/test_tsmr02_chaos_game.py"
      - ".github/workflows/tsmr02-chaos-game.yml"
  push:
    branches: [main]
    paths:
      - "audits/tsmr02_chaos_game.py"
      - "tests/test_tsmr02_chaos_game.py"
      - ".github/workflows/tsmr02-chaos-game.yml"

jobs:
  chaos-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run TSMR-02 regression tests
        run: python -m unittest tests.test_tsmr02_chaos_game -v
