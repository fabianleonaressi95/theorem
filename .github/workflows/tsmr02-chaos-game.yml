name: TSMR-02/03 geometry and refinement tests

on:
  pull_request:
    paths:
      - "audits/tsmr02_chaos_game.py"
      - "tests/test_tsmr02_chaos_game.py"
      - "audits/tsmr03_vesica_geometry.py"
      - "tests/test_tsmr03_vesica_geometry.py"
      - "audits/tsmr03_discrete_refinement.py"
      - "tests/test_tsmr03_discrete_refinement.py"
      - "audits/tsmr_f_multifractal.py"
      - "tests/test_tsmr_f_multifractal.py"
      - "theorems/TSMR-F_multifractal_morphological_equation.md"
      - ".github/workflows/tsmr02-chaos-game.yml"
  push:
    branches: [main]
    paths:
      - "audits/tsmr02_chaos_game.py"
      - "tests/test_tsmr02_chaos_game.py"
      - "audits/tsmr03_vesica_geometry.py"
      - "tests/test_tsmr03_vesica_geometry.py"
      - "audits/tsmr03_discrete_refinement.py"
      - "tests/test_tsmr03_discrete_refinement.py"
      - ".github/workflows/tsmr02-chaos-game.yml"

jobs:
  tsmr-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run TSMR-02 and TSMR-03 regression tests
        run: python -m unittest tests.test_tsmr02_chaos_game tests.test_tsmr03_vesica_geometry tests.test_tsmr03_discrete_refinement tests.test_tsmr_f_multifractal -v
