name: Morandotti isolated Neumann entry diagnostic

on:
  workflow_dispatch:
    inputs:
      mesh_size:
        description: "Target mesh size used by the production run"
        required: true
        default: "0.30"
        type: string
      distance:
        description: "Distance between the two cores"
        required: true
        default: "0.48"
        type: string
      seed:
        description: "Mesh random seed"
        required: true
        default: "11"
        type: string
      cell:
        description: "1-based cell index"
        required: true
        default: "1"
        type: string
      entry:
        description: "1-based upper-triangular P3 entry"
        required: true
        default: "55"
        type: string
      tolerance:
        description: "Absolute integration tolerance"
        required: true
        default: "1/10000"
        type: string

permissions:
  contents: read

jobs:
  isolated-diagnostic:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, basix, gmsh; print('DOLFINx', dolfinx.__version__); print('Basix', basix.__version__); print('Gmsh', gmsh.__version__)"
      - name: Run one-cell, one-entry comparison
        env:
          MESH_SIZE: ${{ inputs.mesh_size }}
          DISTANCE: ${{ inputs.distance }}
          SEED: ${{ inputs.seed }}
          CELL: ${{ inputs.cell }}
          ENTRY: ${{ inputs.entry }}
          TOLERANCE: ${{ inputs.tolerance }}
        run: |
          python3 -m py_compile models/morandotti_certified_rational_integration.py scripts/diagnose_morandotti_neumann_entry.py
          python3 scripts/diagnose_morandotti_neumann_entry.py \
            --mesh-size "$MESH_SIZE" \
            --distance "$DISTANCE" \
            --seed "$SEED" \
            --cell "$CELL" \
            --entry "$ENTRY" \
            --tolerance "$TOLERANCE" \
            --max-depth 24 \
            --max-triangles 512 \
            --out artifacts/morandotti_neumann_diagnostic
      - name: Upload isolated diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-neumann-entry-diagnostic
          path: artifacts/morandotti_neumann_diagnostic/
          if-no-files-found: warn
