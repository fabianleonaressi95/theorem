name: T036 explicit exact 2I irreducible models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t036-explicit-2i-models.yml"
      - "src/t036_2i_irreducible_models.py"
      - "src/t034_exact_2i_character_table.py"
      - "src/t034_binary_icosahedral_representations.py"
      - "src/t032_2i_molien.py"
      - "audits/t035_exact_binary_icosahedral_model.py"
      - "tests/test_t036_2i_irreducible_models.py"
      - "theorems/T036-explicit-2i-irreducible-models.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/t036-explicit-2i-models.yml"
      - "src/t036_2i_irreducible_models.py"
      - "src/t034_exact_2i_character_table.py"
      - "src/t034_binary_icosahedral_representations.py"
      - "src/t032_2i_molien.py"
      - "audits/t035_exact_binary_icosahedral_model.py"
      - "tests/test_t036_2i_irreducible_models.py"
      - "theorems/T036-explicit-2i-irreducible-models.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t036-explicit-2i-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-models:
    name: Build and verify all nine irreducible matrix models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Compile model builder and tests
        run: python -m py_compile src/t036_2i_irreducible_models.py tests/test_t036_2i_irreducible_models.py
      - name: Test all nine exact models
        run: python -m unittest tests.test_t036_2i_irreducible_models -v
      - name: Export exact matrices for all 120 group elements
        run: python -m src.t036_2i_irreducible_models --output data/t036_2i_irreducible_models_exact.json
      - name: Upload exact representation models
        uses: actions/upload-artifact@v4
        with:
          name: t036-exact-2i-irreducible-models
          path: data/t036_2i_irreducible_models_exact.json
          if-no-files-found: error
          retention-days: 90
