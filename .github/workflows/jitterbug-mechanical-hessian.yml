name: Jitterbug 3D rigidity Hessian audit

on:
  push:
    branches: [main]
    paths:
      - "audits/jitterbug_mechanical_hessian.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_mechanical_hessian.py"
      - "research/JITTERBUG_3D_RIGIDITY_HESSIAN_2026-11-24.md"
      - ".github/workflows/jitterbug-mechanical-hessian.yml"
  pull_request:
    paths:
      - "audits/jitterbug_mechanical_hessian.py"
      - "audits/jitterbug_gray_kinematics.py"
      - "tests/test_jitterbug_mechanical_hessian.py"
      - "research/JITTERBUG_3D_RIGIDITY_HESSIAN_2026-11-24.md"
      - ".github/workflows/jitterbug-mechanical-hessian.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rigidity-hessian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_jitterbug_mechanical_hessian.py
      - run: python audits/jitterbug_mechanical_hessian.py
