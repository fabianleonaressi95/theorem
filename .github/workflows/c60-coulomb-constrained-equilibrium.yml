name: C60 constrained Coulomb equilibrium audit
on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Maximum SLSQP iterations"
        required: false
        default: "20000"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and molecular dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy rdkit
      - name: Run constrained Coulomb equilibrium and symmetry audit
        run: |
          python scripts/audit_c60_coulomb_constrained_equilibrium.py \
            --max-iterations "${{ inputs.max_iterations }}" \
            --out-dir c60_coulomb_equilibrium_audit
      - name: Upload numerical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c60-coulomb-constrained-equilibrium-audit
          path: c60_coulomb_equilibrium_audit/
