name: Volterra Morandotti three-core C0-IPDG benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "models/volterra_morandotti_benchmark.py"
      - "scripts/rgs_volterra_morandotti_c0_ipdg.py"
      - "tests/test_volterra_morandotti_benchmark.py"
      - ".github/workflows/volterra-morandotti-c0-ipdg.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volterra-morandotti-c0-ipdg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matched-three-core-p3:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('Gmsh', gmsh.__version__)"
          python3 -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"
      - name: Compile benchmark modules
        run: python3 -m compileall -q models/volterra_morandotti_benchmark.py scripts/rgs_volterra_morandotti_c0_ipdg.py
      - name: Run source-moment matching tests
        run: python3 -m pytest -q tests/test_volterra_morandotti_benchmark.py tests/test_morandotti_cell_reconstruction.py
      - name: Run matched three-core C0-IPDG benchmark
        run: |
          python3 scripts/rgs_volterra_morandotti_c0_ipdg.py \
            --separations 0.48 \
            --core-radii 0.06 0.04 0.03 \
            --mesh-size-factors 1.0 0.75 \
            --alpha 10 \
            --young-modulus 1.0 \
            --poisson-ratio 0.0 \
            --out artifacts/volterra_morandotti_c0_ipdg/report.json
      - name: Upload C0-IPDG report
        uses: actions/upload-artifact@v4
        with:
          name: volterra-morandotti-three-core-c0-ipdg-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/volterra_morandotti_c0_ipdg/
          if-no-files-found: error
          retention-days: 14
