name: T159 Curved FEEC refinement audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_t159_curved_feec_refinement.py"
      - "tests/test_t159_curved_feec_refinement.py"
      - "theorems/T159-curved-feec-mesh-refinement.md"
      - ".github/workflows/t159-curved-feec-refinement.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refinement-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python scripts/audit_t159_curved_feec_refinement.py
      - run: python -m unittest tests.test_t159_curved_feec_refinement
      - uses: actions/upload-artifact@v4
        with:
          name: t159-curved-feec-refinement
          path: results/json/t159_curved_feec_refinement.json
          retention-days: 30
