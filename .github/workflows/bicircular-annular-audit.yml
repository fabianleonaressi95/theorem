name: T099 bicircular-annular audit

on:
  pull_request:
    paths:
      - ".github/workflows/bicircular-annular-audit.yml"
      - "models/bicircular_annular_geometry.py"
      - "scripts/run_bicircular_annular_audit.py"
      - "tests/test_bicircular_annular_geometry.py"
      - "reports/bicircular_annular_audit.json"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bicircular-annular-audit.yml"
      - "models/bicircular_annular_geometry.py"
      - "scripts/run_bicircular_annular_audit.py"
      - "tests/test_bicircular_annular_geometry.py"
      - "reports/bicircular_annular_audit.json"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run manufactured numerical audit
        run: python scripts/run_bicircular_annular_audit.py --out artifacts/bicircular_annular_audit.json
      - name: Run focused geometry tests
        run: python -m pytest -q tests/test_bicircular_annular_geometry.py
      - name: Upload generated audit
        uses: actions/upload-artifact@v4
        with:
          name: t099-bicircular-annular-audit
          path: artifacts/bicircular_annular_audit.json
          if-no-files-found: error
