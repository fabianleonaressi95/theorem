name: C60 icosahedral connection and spectral decomposition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_c60_icosahedral_connection.py"
      - "scripts/audit_c60_mmff94s_relaxed_coulomb.py"
      - ".github/workflows/c60-icosahedral-connection.yml"

jobs:
  reconstruct-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and molecular dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy rdkit
      - name: Reconstruct and audit ideal C60
        run: |
          python scripts/audit_c60_icosahedral_connection.py \
            --out-dir c60_icosahedral_ideal
      - name: Reconstruct MMFF94s geometry and audit its connection spectrum
        run: |
          python scripts/audit_c60_mmff94s_relaxed_coulomb.py \
            --out-dir c60_mmff94s_start
          python scripts/audit_c60_icosahedral_connection.py \
            --mmff-npz c60_mmff94s_start/C60_MMFF94s_relaxed_coulomb.npz \
            --out-dir c60_icosahedral_mmff94s
      - name: Upload ideal and relaxed numerical reports
        uses: actions/upload-artifact@v4
        with:
          name: c60-icosahedral-connection-audit
          path: |
            c60_icosahedral_ideal/
            c60_mmff94s_start/
            c60_icosahedral_mmff94s/
