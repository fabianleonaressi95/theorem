name: EQC RGS-Q6 gate audit

on:
  pull_request:
    paths:
      - "audits/morphodynamics/eqc_rgs_q6_gates.py"
      - "audits/morphodynamics/q6_mqm_symmetry.py"
      - "models/eqc_language.py"
      - "tests/test_eqc_rgs_q6_gates.py"
      - "theorems/EQC-RGS-Q6-gate-realization.md"

permissions:
  contents: read

jobs:
  finite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused EQC–RGS–Q6 tests
        run: python -m unittest discover -s tests -p "test_eqc_rgs_q6_gates.py" -v
