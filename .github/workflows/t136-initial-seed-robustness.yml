name: T136 initial-seed robustness

on:
  pull_request:
    paths:
      - "audits/t136_initial_seed_robustness.py"
      - "audits/t136_exact_design_comparison.py"
      - "audits/t136_nonquadratic_conformal.py"
      - "audits/t136_moment_design_optimization.py"
      - "audits/t136_scale_selection.py"
      - "tests/test_t136_initial_seed_robustness.py"
      - ".github/workflows/t136-initial-seed-robustness.yml"
  workflow_dispatch:

jobs:
  t136-initial-seed-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade numpy
      - name: Run focused regression tests
        run: python -m unittest discover -s tests -p "test_t136_initial_seed_robustness.py" -v
      - name: Run initial-seed sensitivity audit
        run: python -m audits.t136_initial_seed_robustness > t136_initial_seed_robustness.json
      - name: Upload numerical results
        uses: actions/upload-artifact@v4
        with:
          name: t136-initial-seed-robustness
          path: t136_initial_seed_robustness.json
