name: C60 Stone-Wales 90-degree graph audit
on:
  push:
    branches:
      - research/c60-sw-orbit-classification
    paths:
      - "scripts/classify_c60_sw_orbits.py"
      - "tests/test_c60_sw_orbits.py"
      - ".github/workflows/c60-stone-wales.yml"
  pull_request:
    paths:
      - "scripts/audit_c60_stone_wales.py"
      - "scripts/audit_c60_mmff94s_relaxed_coulomb.py"
      - "scripts/classify_c60_sw_orbits.py"
      - "tests/test_c60_stone_wales.py"
      - "tests/test_c60_sw_orbits.py"
      - "tests/test_c60_stone_wales.py"
      - "docs/C60_STONE_WALES_90_DEGREE_GRAPH_AUDIT.md"
      - ".github/workflows/c60-stone-wales.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy networkx rdkit pytest
      - run: python scripts/audit_c60_stone_wales.py --out-dir c60_stone_wales_audit --relax
      - run: python scripts/classify_c60_sw_orbits.py --out c60_stone_wales_audit/orbit_classification.json
      - run: pytest -q tests/test_c60_stone_wales.py tests/test_c60_sw_orbits.py
      - run: pytest -q tests/test_c60_stone_wales.py
      - uses: actions/upload-artifact@v4
        with:
          name: c60-stone-wales-90-degree-audit
          path: c60_stone_wales_audit/
