name: PRISM cellular automata and FEEC boundary audit

on:
  push:
    paths:
      - "models/prism_cellular_automata.py"
      - "models/prism_ca_evolution.py"
      - "tests/test_prism_cellular_automata.py"
      - "tests/test_prism_ca_evolution.py"
      - "scripts/run_prism_ca_evolution.py"
      - "scripts/run_prism_ca_benchmark.py"
      - "scripts/run_prism_ca_coevolution.py"
      - "models/prism_billiard_coding.py"
      - "tests/test_prism_billiard_coding.py"
      - "scripts/run_prism_billiard_coding.py"
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/prism-ca.yml"
  pull_request:
    paths:
      - "models/prism_cellular_automata.py"
      - "models/prism_ca_evolution.py"
      - "tests/test_prism_cellular_automata.py"
      - "tests/test_prism_ca_evolution.py"
      - "scripts/run_prism_ca_evolution.py"
      - "scripts/run_prism_ca_benchmark.py"
      - "scripts/run_prism_ca_coevolution.py"
      - "models/prism_billiard_coding.py"
      - "tests/test_prism_billiard_coding.py"
      - "scripts/run_prism_billiard_coding.py"
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/prism-ca.yml"
  workflow_dispatch:

jobs:
  prism-ca-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest numpy scipy
      - name: Run PRISM CA and evolutionary-search tests
        run: >-
          python -m pytest
          tests/test_prism_cellular_automata.py
          tests/test_prism_ca_evolution.py
          tests/test_prism_billiard_coding.py
          -q

  feec-relative-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FEEC numerical and test dependencies
        run: python -m pip install --upgrade pytest numpy scipy
      - name: Run relative-boundary and FEEC regression tests
        working-directory: projects/de_rham_benchmark
        run: python -m pytest -q test_boundary_complex.py test_feec_study.py
      - name: Reproduce relative codifferential refinement study
        if: always()
        working-directory: projects/de_rham_benchmark
        run: python run_relative_codifferential_study.py --levels 4 8 16 --output reports/relative_codifferential.json
      - name: Upload relative codifferential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relative-codifferential-study
          path: projects/de_rham_benchmark/reports/relative_codifferential.json
