name: PRISM cellular automata

on:
  push:
    paths:
      - "models/prism_cellular_automata.py"
      - "models/prism_ca_evolution.py"
      - "tests/test_prism_cellular_automata.py"
      - "tests/test_prism_ca_evolution.py"
      - "scripts/run_prism_ca_evolution.py"
      - "scripts/run_prism_ca_benchmark.py"
      - "scripts/run_prism_ca_coevolution.py"
      - "models/prism_billiard_coding.py"
      - "tests/test_prism_billiard_coding.py"
      - "scripts/run_prism_billiard_coding.py"
      - ".github/workflows/prism-ca.yml"
      - "models/football_anisotropy.py"
      - "scripts/run_football_anisotropy_audit.py"
      - "tests/test_football_anisotropy.py"
      - "models/football_shell.py"
      - "models/football_quaternion_tangent.py"
      - "tests/test_football_quaternion_tangent.py"
      - "models/football_quaternion_bridge.py"
      - "tests/test_football_quaternion_bridge.py"
      - "docs/RGS_FOOTBALL_QUATERNION_BRIDGE.md"
      - "docs/FOOTBALL_QUATERNION_TANGENT.md"
      - "scripts/run_football_shell_audit.py"
      - "tests/test_football_shell.py"
      - "docs/FOOTBALL_ORTHOTROPIC_DISCRETE_SHELL.md"
      - "data/scans/**"
      - "docs/FOOTBALL_PENTAGON_HEXAGON_ANISOTROPY.md"
      - "reports/football_anisotropy_audit.json"
      - "reports/football_anisotropy_displacement.svg"
      - ".github/workflows/football-anisotropy.yml"
  pull_request:
    paths:
      - "models/prism_cellular_automata.py"
      - "models/prism_ca_evolution.py"
      - "tests/test_prism_cellular_automata.py"
      - "tests/test_prism_ca_evolution.py"
      - "scripts/run_prism_ca_evolution.py"
      - "scripts/run_prism_ca_benchmark.py"
      - "scripts/run_prism_ca_coevolution.py"
      - ".github/workflows/prism-ca.yml"
      - "models/football_anisotropy.py"
      - "scripts/run_football_anisotropy_audit.py"
      - "tests/test_football_anisotropy.py"
      - "models/football_shell.py"
      - "scripts/run_football_shell_audit.py"
      - "tests/test_football_shell.py"
      - "docs/FOOTBALL_ORTHOTROPIC_DISCRETE_SHELL.md"
      - "data/scans/**"
      - "docs/FOOTBALL_PENTAGON_HEXAGON_ANISOTROPY.md"
      - "reports/football_anisotropy_audit.json"
      - "reports/football_anisotropy_displacement.svg"
  workflow_dispatch:

jobs:
  prism-ca-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest numpy scipy
      - name: Run PRISM CA and evolutionary-search tests
        run: >-
          python -m pytest
          tests/test_prism_cellular_automata.py
          tests/test_prism_ca_evolution.py
          tests/test_prism_billiard_coding.py
          tests/test_football_anisotropy.py
          tests/test_football_shell.py
          tests/test_football_quaternion_tangent.py
          tests/test_football_quaternion_bridge.py
          -q
      - name: Reproduce orthotropic football shell audit
        run: >-
          python scripts/run_football_shell_audit.py
          --json reports/football_shell_audit.json
          --csv reports/football_shell_displacements.csv
      - name: Reproduce football anisotropy audit
        run: >-
          python scripts/run_football_anisotropy_audit.py
          --json reports/football_anisotropy_audit.json
          --svg reports/football_anisotropy_displacement.svg

      - name: Upload reproducible football audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: football-shell-audit
          path: |
            reports/football_shell_audit.json
            reports/football_shell_displacements.csv
            reports/football_anisotropy_audit.json
            reports/football_anisotropy_displacement.svg
