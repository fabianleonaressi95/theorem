name: T157 full covariant Whitney curvature audit
on:
  push:
    paths:
      - "scripts/audit_t157_full_covariant_whitney_curvature.py"
      - "tests/test_t157_full_covariant_whitney_curvature.py"
      - ".github/workflows/t157-covariant-whitney.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python scripts/audit_t157_full_covariant_whitney_curvature.py
      - run: python -m unittest tests.test_t157_full_covariant_whitney_curvature
      - uses: actions/upload-artifact@v4
        with:
          name: t157-full-covariant-whitney-report
          path: results/json/t157_full_covariant_whitney_curvature.json
          retention-days: 30
