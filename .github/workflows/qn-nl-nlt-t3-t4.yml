name: Q4-Q6 NL/NLT T3-T4 code checks

on:
  pull_request:
    paths:
      - 'models/q6_topological_synchronization.py'
      - 'scripts/run_qn_nl_nlt_t3_t4.py'
      - 'scripts/run_q6_nl_nlt_robustness.py'
      - 'tests/test_qn_cubical_complex.py'
      - '.github/workflows/qn-nl-nlt-t3-t4.yml'
  push:
    branches:
      - 'work/q6-nl-nlt-t3-t4-robustness'
    paths:
      - 'models/q6_topological_synchronization.py'
      - 'scripts/run_qn_nl_nlt_t3_t4.py'
      - 'scripts/run_q6_nl_nlt_robustness.py'
      - 'tests/test_qn_cubical_complex.py'
      - '.github/workflows/qn-nl-nlt-t3-t4.yml'

jobs:
  cubical-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile scripts
        run: python -m py_compile models/q6_topological_synchronization.py scripts/run_qn_nl_nlt_t3_t4.py scripts/run_q6_nl_nlt_robustness.py scripts/run_q6_nl_nlt_t1_t2.py tests/test_qn_cubical_complex.py
      - name: Test Q4/Q5/Q6 incidence and frozen vector fields
        run: python -m pytest -q tests/test_qn_cubical_complex.py
