name: Hysteresis dataset audit
on:
  push:
    branches: [main]
    paths:
      - 'Hysteresis_datasets.xlsx'
      - 'scripts/audit_hysteresis_dataset.py'
      - '.github/workflows/hysteresis-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade numpy pandas scipy openpyxl
      - name: Verify workbook and run audit
        run: |
          test -s Hysteresis_datasets.xlsx
          python scripts/audit_hysteresis_dataset.py Hysteresis_datasets.xlsx --out hysteresis_audit
      - name: Upload reproducible audit
        uses: actions/upload-artifact@v4
        with:
          name: hysteresis-audit
          path: hysteresis_audit/
          if-no-files-found: error
