name: 64-TG FCC coordinate audit

on:
  push:
    paths:
      - "data/64tg_fcc_coordinates.json"
      - "scripts/audit_64tg_fcc_coordinates.py"
      - "tests/test_64tg_fcc_coordinates.py"
      - ".github/workflows/64tg-fcc-coordinates.yml"
  pull_request:
    paths:
      - "data/64tg_fcc_coordinates.json"
      - "scripts/audit_64tg_fcc_coordinates.py"
      - "tests/test_64tg_fcc_coordinates.py"
      - ".github/workflows/64tg-fcc-coordinates.yml"

jobs:
  exact-coordinate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate coordinate data and verify exact counts
        run: python scripts/audit_64tg_fcc_coordinates.py
      - name: Verify committed coordinate dataset is reproducible
        run: git diff --exit-code -- data/64tg_fcc_coordinates.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_64tg_fcc_coordinates.py" -v
