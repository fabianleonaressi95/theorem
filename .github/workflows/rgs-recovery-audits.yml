name: RGS recovery audits
on:
  push:
    paths:
      - 'scripts/audit_prism_69120.py'
      - 'scripts/audit_188d_antitwin.py'
      - 'tests/test_prism_audit.py'
      - 'tests/test_188d_antitwin_audit.py'
      - '.github/workflows/rgs-recovery-audits.yml'
  pull_request:
    paths:
      - 'scripts/audit_prism_69120.py'
      - 'scripts/audit_188d_antitwin.py'
      - 'tests/test_prism_audit.py'
      - 'tests/test_188d_antitwin_audit.py'
      - '.github/workflows/rgs-recovery-audits.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m pytest -q tests/test_prism_audit.py tests/test_188d_antitwin_audit.py
      - run: python scripts/audit_prism_69120.py --json reports/prism_69120_audit_ci.json --no-save-incidence
      - uses: actions/upload-artifact@v4
        with:
          name: rgs-recovery-audit-reports
          path: reports/*audit_ci.json
          if-no-files-found: warn
