name: Q6 topological hysteresis benchmark

on:
  push:
    branches: ['**']
    paths:
      - "models/q6_topological_synchronization.py"
      - "models/hysteresis_metrics.py"
      - "models/constitutive_hysteresis.py"
      - "scripts/run_q6_hysteresis_benchmark.py"
      - "scripts/run_q6_hysteresis_sweep_study.py"
      - "tests/test_q6_topological_synchronization.py"
      - "tests/test_hysteresis_metrics.py"
      - "tests/test_constitutive_hysteresis.py"
      - "tests/test_q6_hysteresis_sweep_study.py"
      - "projects/q6_hysteresis_benchmark/**"
      - ".github/workflows/q6-hysteresis-benchmark.yml"
  pull_request:
    paths:
      - "models/q6_topological_synchronization.py"
      - "models/hysteresis_metrics.py"
      - "models/constitutive_hysteresis.py"
      - "scripts/run_q6_hysteresis_benchmark.py"
      - "scripts/run_q6_hysteresis_sweep_study.py"
      - "tests/test_q6_topological_synchronization.py"
      - "tests/test_hysteresis_metrics.py"
      - "tests/test_constitutive_hysteresis.py"
      - "tests/test_q6_hysteresis_sweep_study.py"
      - "projects/q6_hysteresis_benchmark/**"
      - ".github/workflows/q6-hysteresis-benchmark.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest matplotlib
      - run: python -m pytest -q tests/test_q6_topological_synchronization.py tests/test_hysteresis_metrics.py tests/test_constitutive_hysteresis.py tests/test_q6_hysteresis_sweep_study.py
      - run: python scripts/run_q6_hysteresis_benchmark.py --steps-per-sigma 5 --sigma-count 3 --output /tmp/q6-hysteresis.json
      - run: python scripts/run_q6_hysteresis_sweep_study.py --seeds 2,5 --dwell-steps 1,2 --sigma-max 0.2 --sigma-count 3 --dt 0.01 --output /tmp/q6-hysteresis-sweep-smoke.json --plot-prefix /tmp/q6-hysteresis-sweep-smoke
      - run: mkdir -p results
      - run: python scripts/run_q6_hysteresis_sweep_study.py --seeds 11,23,37,51,67 --dwell-steps 10,40,160,640 --sigma-max 2 --sigma-count 21 --dt 0.025 --omega0 2 --omega1 2 --tau0 1 --tau1 1 --output results/q6_hysteresis_sweep_study.json --plot-prefix results/q6_hysteresis_sweep
      - uses: actions/upload-artifact@v4
        with:
          name: q6-multiseed-multirate-study
          path: |
            results/q6_hysteresis_sweep_study.json
            results/q6_hysteresis_sweep_nl.png
            results/q6_hysteresis_sweep_nlt.png
          if-no-files-found: error
