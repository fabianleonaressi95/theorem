name: Q6 NL NLT T1 T2 verification

on:
  workflow_dispatch:
    inputs:
      t1_starts:
        description: "Independent initial conditions per sigma for homogeneous Newton search"
        required: true
        default: "200"
      sigmas:
        description: "Comma-separated sigma grid"
        required: true
        default: "0.00,0.05,0.10,0.15,0.20,0.25,0.30,0.35,0.40,0.45,0.50,0.55,0.60,0.65,0.70,0.75,0.80,0.85,0.90,0.95,1.00,1.05,1.10,1.15,1.20,1.25,1.30,1.35,1.40,1.45,1.50,1.55,1.60,1.65,1.70,1.75,1.80,1.85,1.90,1.95,2.00"
      t2_steps:
        description: "T in integration steps; snapshots at T, 2T, 4T"
        required: true
        default: "640"
  push:
    branches: [work/rgs-defect-benchmark-torino]
    paths:
      - "scripts/run_q6_nl_nlt_t1_t2.py"
      - "models/q6_topological_synchronization.py"
      - ".github/workflows/q6-nl-nlt-t1-t2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run pre-registered T1 and T2
        env:
          T1_STARTS: ${{ github.event.inputs.t1_starts || '200' }}
          SIGMAS: ${{ github.event.inputs.sigmas || '0.00,0.05,0.10,0.15,0.20,0.25,0.30,0.35,0.40,0.45,0.50,0.55,0.60,0.65,0.70,0.75,0.80,0.85,0.90,0.95,1.00,1.05,1.10,1.15,1.20,1.25,1.30,1.35,1.40,1.45,1.50,1.55,1.60,1.65,1.70,1.75,1.80,1.85,1.90,1.95,2.00' }}
          T2_STEPS: ${{ github.event.inputs.t2_steps || '640' }}
        run: |
          python scripts/run_q6_nl_nlt_t1_t2.py \
            --sigmas "$SIGMAS" \
            --t1-starts "$T1_STARTS" \
            --T-steps "$T2_STEPS" \
            --dt 0.025 \
            --output artifacts/q6_nl_nlt_t1_t2.json
      - name: Upload T1 T2 JSON report
        uses: actions/upload-artifact@v4
        with:
          name: q6-nl-nlt-t1-t2
          path: artifacts/q6_nl_nlt_t1_t2.json
          if-no-files-found: error
