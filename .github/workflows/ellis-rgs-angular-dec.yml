name: Ellis-RGS angular DEC regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angular-dec-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Ellis-RGS radial-icosphere tests
        run: python -m pytest -q tests/test_ellis_rgs_radial_icosphere_prototype.py
