name: T156 Vesica–Mobius–Farey and finite-width elastic BVP

on:
  push:
    paths:
      - "scripts/audit_t156_vesica_mobius_farey.py"
      - "tests/test_t156_vesica_mobius_farey.py"
      - "scripts/solve_t156_mobius_elastic_bvp.py"
      - "tests/test_t156_mobius_elastic_bvp.py"
      - ".github/workflows/t156-mobius-elastic-bvp.yml"
  pull_request:
    paths:
      - "scripts/audit_t156_vesica_mobius_farey.py"
      - "tests/test_t156_vesica_mobius_farey.py"
      - "scripts/solve_t156_mobius_elastic_bvp.py"
      - "tests/test_t156_mobius_elastic_bvp.py"
      - ".github/workflows/t156-mobius-elastic-bvp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t156-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Run exact Vesica–Farey algebra audit
        run: python scripts/audit_t156_vesica_mobius_farey.py
      - name: Run exact algebra regression tests
        run: python -m unittest discover -s tests -p "test_t156_vesica_mobius_farey.py" -v
      - name: Attempt finite-width symmetric Mobius BVP
        run: python scripts/solve_t156_mobius_elastic_bvp.py
      - name: Run BVP formulation tests
        if: always()
        run: python -m unittest discover -s tests -p "test_t156_mobius_elastic_bvp.py" -v
      - name: Upload BVP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t156-mobius-elastic-bvp-report
          path: results/t156_mobius_elastic_bvp.json
          if-no-files-found: warn
          retention-days: 30
