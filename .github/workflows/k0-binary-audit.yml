name: K0 binary audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/K0.npy"
      - "artifacts/K0_inv.npy"
      - "audits/K0_*REPORT.json"
      - "audits/K0_*CERTIFICATION.json"
      - "archive/RGS_PSU_OH_K0_AUDIT.zip"
      - "archive/RGS_PSU_alignment_K0_audit.zip"
      - "artifacts/two_time_kernel_*.npz"
      - ".github/workflows/k0-binary-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3"

      - name: Inspect K0 matrices, ZIP archives and NPZ payloads
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          import numpy as np

          report = {
              "scope": "read-only audit of K0 matrices, K0 audit ZIPs and two-time NPZ files",
              "matrices": {},
              "archives": [],
              "npz_files": [],
              "json_reports": {},
              "errors": [],
          }

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def relnorm(a, b):
              den = float(np.linalg.norm(a))
              return float(np.linalg.norm(a - b) / den) if den else float(np.linalg.norm(a - b))

          matrices = {}
          for name in ("K0.npy", "K0_inv.npy"):
              path = Path("artifacts") / name
              if not path.is_file():
                  report["errors"].append(f"missing {name}")
                  continue
              try:
                  a = np.load(path, allow_pickle=False)
                  if a.ndim != 2 or a.shape[0] != a.shape[1]:
                      raise ValueError(f"expected square matrix, got {a.shape}")
                  if not np.issubdtype(a.dtype, np.number):
                      raise TypeError(f"non-numeric dtype {a.dtype}")
                  s = np.linalg.svd(a.astype(np.float64), compute_uv=False)
                  rank = int(np.linalg.matrix_rank(a))
                  item = {
                      "shape": list(a.shape),
                      "dtype": str(a.dtype),
                      "sha256": sha256(path),
                      "finite": bool(np.isfinite(a).all()),
                      "symmetry_relative_error": relnorm(a, a.T),
                      "singular_value_max": float(s[0]) if len(s) else 0.0,
                      "singular_value_min": float(s[-1]) if len(s) else 0.0,
                      "numerical_rank": rank,
                      "numerical_nullity": int(a.shape[0] - rank),
                  }
                  report["matrices"][name] = item
                  matrices[name] = a.astype(np.float64)
              except Exception as exc:
                  report["errors"].append(f"{name}: {type(exc).__name__}: {exc}")

          if "K0.npy" in matrices and "K0_inv.npy" in matrices:
              k, b = matrices["K0.npy"], matrices["K0_inv.npy"]
              if k.shape != b.shape:
                  report["errors"].append(f"K0 shape {k.shape} differs from K0_inv shape {b.shape}")
              else:
                  try:
                      kb, bk = k @ b, b @ k
                      report["pseudoinverse_tests"] = {
                          "K0_K0inv_K0_relative_residual": relnorm(k @ b @ k, k),
                          "K0inv_K0_K0inv_relative_residual": relnorm(b @ k @ b, b),
                          "K0_K0inv_projector_symmetry_relative_error": relnorm(kb, kb.T),
                          "K0inv_K0_projector_symmetry_relative_error": relnorm(bk, bk.T),
                          "interpretation": "Moore-Penrose candidate; small values support, but do not alone prove, pseudoinverse status",
                      }
                  except Exception as exc:
                      report["errors"].append(f"pseudoinverse tests: {type(exc).__name__}: {exc}")

          for path in sorted(Path("archive").glob("*.zip")):
              if "k0" not in path.name.lower() or "audit" not in path.name.lower():
                  continue
              item = {"file": path.name, "bytes": path.stat().st_size, "sha256": sha256(path), "members": []}
              try:
                  with zipfile.ZipFile(path) as z:
                      bad = z.testzip()
                      item["crc_check"] = "ok" if bad is None else f"failed at {bad}"
                      for info in z.infolist():
                          item["members"].append({
                              "name": info.filename,
                              "bytes": info.file_size,
                              "compressed_bytes": info.compress_size,
                              "sha256": hashlib.sha256(z.read(info.filename)).hexdigest(),
                          })
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
                  report["errors"].append(f"{path.name}: {item['error']}")
              report["archives"].append(item)

          for path in sorted(Path("artifacts").glob("two_time_kernel_*.npz")):
              item = {"file": path.name, "bytes": path.stat().st_size, "sha256": sha256(path), "arrays": []}
              try:
                  with np.load(path, allow_pickle=False) as data:
                      for key in data.files:
                          a = data[key]
                          item["arrays"].append({
                              "key": key,
                              "shape": list(a.shape),
                              "dtype": str(a.dtype),
                              "finite": bool(np.isfinite(a).all()) if np.issubdtype(a.dtype, np.number) else None,
                          })
              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
                  report["errors"].append(f"{path.name}: {item['error']}")
              report["npz_files"].append(item)

          for path in sorted(Path("audits").glob("K0_*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  report["json_reports"][path.name] = {
                      "top_level_type": type(data).__name__,
                      "top_level_keys": list(data.keys()) if isinstance(data, dict) else None,
                      "sha256": sha256(path),
                  }
              except Exception as exc:
                  report["errors"].append(f"{path.name}: {type(exc).__name__}: {exc}")

          Path("k0-binary-audit.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          lines = [
              "# K0 binary audit",
              "",
              "Read-only inspection. Numerical residuals are diagnostics, not proofs.",
              "",
              "## Matrices",
              "",
              "| File | Shape | dtype | rank | nullity | symmetry rel. error |",
              "|---|---:|---|---:|---:|---:|",
          ]
          for name, x in report["matrices"].items():
              lines.append(f"| {name} | {x['shape']} | {x['dtype']} | {x['numerical_rank']} | {x['numerical_nullity']} | {x['symmetry_relative_error']:.6g} |")
          lines += ["", "## Moore-Penrose candidate tests", ""]
          tests = report.get("pseudoinverse_tests", {})
          if tests:
              for key, value in tests.items():
                  if isinstance(value, (int, float)):
                      lines.append(f"- {key}: {value:.8g}")
          else:
              lines.append("- Not run (missing matrices, incompatible shapes, or numerical error).")
          lines += ["", "## ZIP archives", ""]
          for archive in report["archives"]:
              lines.append(f"- **{archive['file']}** — {archive.get('crc_check', archive.get('error', 'not checked'))}; {len(archive.get('members', []))} entries.")
              for member in archive.get("members", []):
                  lines.append(f"  - {member['name']} ({member['bytes']} bytes; SHA-256 {member['sha256']})")
          lines += ["", "## Two-time NPZ files", ""]
          for item in report["npz_files"]:
              lines.append(f"- **{item['file']}** — SHA-256 {item['sha256']}")
              for array in item.get("arrays", []):
                  lines.append(f"  - {array['key']}: shape={array['shape']}, dtype={array['dtype']}, finite={array['finite']}")
          lines += ["", "## Errors", ""]
          lines += [f"- {e}" for e in report["errors"]] or ["- None."]
          Path("k0-binary-audit.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("k0-binary-audit.md").read_text(encoding="utf-8"))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: k0-binary-audit
          path: |
            k0-binary-audit.json
            k0-binary-audit.md
          if-no-files-found: error
          retention-days: 30
