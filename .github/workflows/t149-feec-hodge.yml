name: T149 regular dodecahedron FEEC Hodge audit
on:
  push:
    paths:
      - "scripts/audit_t149_dodecahedron_feec_hodge.py"
      - "tests/test_t149_dodecahedron_feec_hodge.py"
      - ".github/workflows/t149-feec-hodge.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python scripts/audit_t149_dodecahedron_feec_hodge.py
      - run: python -m unittest tests.test_t149_dodecahedron_feec_hodge
      - uses: actions/upload-artifact@v4
        with:
          name: t149-feec-hodge-report
          path: results/json/t149_supergolden_dodecahedron_feec_hodge.json
          retention-days: 30
