name: T156 Dodecahedral FEEC Hodge audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_t156_dodecahedral_feec_hodge.py"
      - "tests/test_t156_dodecahedral_feec_hodge.py"
      - "theorems/T156-whitney-feec-hodge-dodecahedral-surface.md"
      - ".github/workflows/t156-dodecahedral-feec-hodge-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python scripts/audit_t156_dodecahedral_feec_hodge.py
      - run: python -m unittest tests.test_t156_dodecahedral_feec_hodge
      - uses: actions/upload-artifact@v4
        with:
          name: t156-dodecahedral-feec-hodge-audit
          path: results/json/t156_dodecahedral_feec_hodge_audit.json
          retention-days: 30
