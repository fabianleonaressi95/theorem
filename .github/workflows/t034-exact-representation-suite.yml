name: T034 exact binary icosahedral representation suite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t034-exact-representation-suite.yml"
      - "src/t034_binary_icosahedral_representations.py"
      - "scripts/audit_runtime.py"
      - "scripts/render_audit_summary.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/t034-exact-representation-suite.yml"
      - "src/t034_binary_icosahedral_representations.py"
      - "scripts/audit_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t034-exact-representation-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-t034-shards:
    name: T034 exact audit degrees ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { start: 0, end: 3 }
          - { start: 4, end: 7 }
          - { start: 8, end: 10 }
          - { start: 11, end: 13 }
    env:
      AUDIT_PROGRESS_FILE: artifacts/audit_progress/t034-${{ matrix.start }}-${{ matrix.end }}.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the T034 module and audit helpers
        run: python -m py_compile scripts/audit_runtime.py scripts/render_audit_summary.py src/t034_binary_icosahedral_representations.py
      - name: Execute bounded exact T034 degree shard
        run: |
          python -m src.t034_binary_icosahedral_representations \
            --output "t034-${{ matrix.start }}-${{ matrix.end }}.json" \
            --projector-start "${{ matrix.start }}" --projector-end "${{ matrix.end }}"
      - name: Render shard timing summary
        if: always()
        run: python scripts/render_audit_summary.py "$AUDIT_PROGRESS_FILE"
      - name: Upload T034 degree shard and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t034-degree-shard-${{ matrix.start }}-${{ matrix.end }}
          path: |
            t034-${{ matrix.start }}-${{ matrix.end }}.json
            artifacts/audit_progress/t034-${{ matrix.start }}-${{ matrix.end }}.jsonl
          if-no-files-found: warn
          retention-days: 30

  assemble-t034-certificate:
    name: Assemble complete T034 certificate (degrees 0-13)
    needs: exact-t034-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all degree shards
        uses: actions/download-artifact@v4
        with:
          pattern: t034-degree-shard-*
          path: shards
          merge-multiple: true
      - name: Validate complete degree coverage and assemble JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {(0,3), (4,7), (8,10), (11,13)}
          payloads = [json.loads(p.read_text()) for p in sorted(Path("shards").glob("t034-*.json"))]
          assert len(payloads) == 4, f"expected four shards, got {len(payloads)}"
          ranges = {tuple(p["verification"]["projector_degree_shard"]) for p in payloads}
          assert ranges == expected, ranges
          base = payloads[0]
          for p in payloads[1:]:
              assert p["group"] == base["group"] and p["order"] == base["order"] == 120
              assert p["irreps"] == base["irreps"]
          report = dict(base["verification"])
          report["projector_degree_shards"] = [list(x) for x in sorted(ranges)]
          report["projectors_on_sym"] = [item for p in payloads for item in p["verification"]["projectors_on_sym"]]
          report["matrix_units"] = [item for p in payloads for item in p["verification"]["matrix_units"]]
          assert len(report["projectors_on_sym"]) == 14
          assert {item["m"] for item in report["projectors_on_sym"]} == set(range(14))
          matrix_degrees = {int(item["representation"].replace("Sym^", "")) for item in report["matrix_units"] if item["representation"].startswith("Sym^") and "direct-sum" not in item["representation"]}
          assert matrix_degrees == set(range(8)), matrix_degrees
          assert any(item["representation"] == "Sym^2 direct-sum Sym^10" for item in report["matrix_units"])
          report["status"] = "PASS"
          base["verification"] = report
          Path("t034_2i_character_table.json").write_text(json.dumps(base, indent=2)+"\\n")
          print("T034 shards assembled: exact base checks plus all 14 projector degrees.")
          PY
      - name: Upload assembled T034 certificate
        uses: actions/upload-artifact@v4
        with:
          name: t034-exact-representation-suite
          path: t034_2i_character_table.json
          if-no-files-found: error
          retention-days: 90
