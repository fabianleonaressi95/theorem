name: T035 exact binary icosahedral model

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t035-exact-binary-icosahedral.yml"
      - "audits/t035_exact_binary_icosahedral_model.py"
      - "tests/test_t035_exact_binary_icosahedral_model.py"
      - "theorems/T035-exact-binary-icosahedral-model.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/t035-exact-binary-icosahedral.yml"
      - "audits/t035_exact_binary_icosahedral_model.py"
      - "tests/test_t035_exact_binary_icosahedral_model.py"
      - "theorems/T035-exact-binary-icosahedral-model.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t035-exact-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t035-exact-model:
    name: Exact 2I group and defining SU(2) representation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Compile T035 audit
        run: python -m py_compile audits/t035_exact_binary_icosahedral_model.py
      - name: Run T035 regression tests
        run: python -m unittest tests.test_t035_exact_binary_icosahedral_model -v
      - name: Run exact T035 audit
        run: python audits/t035_exact_binary_icosahedral_model.py --output t035-audit.json
      - name: Upload exact audit report
        uses: actions/upload-artifact@v4
        with:
          name: t035-exact-audit
          path: t035-audit.json
          if-no-files-found: error
          retention-days: 90
