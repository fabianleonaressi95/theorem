name: Airy eigenstrain source-map audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/rgs_airy_eigenstrain_map.py'
      - 'tests/test_rgs_airy_eigenstrain_map.py'
      - 'docs/rgs_defect_benchmark/AIRY_EIGENSTRAIN_COMMON_SOURCE_MAP.md'
      - '.github/workflows/airy-eigenstrain-source-map.yml'
  workflow_dispatch:

  # Focused numerical identity checks only; no FE solver dependency.\n\npermissions:
  contents: read

jobs:
  source-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy pytest
      - run: python -m pytest -q tests/test_rgs_airy_eigenstrain_map.py
