name: T020 gauge-covariant Q6 audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/t020_gauge_covariant_q6_audit.py"
      - ".github/workflows/t020-gauge-audit.yml"
  pull_request:
    paths:
      - "scripts/t020_gauge_covariant_q6_audit.py"
      - ".github/workflows/t020-gauge-audit.yml"
  workflow_dispatch:

jobs:
  finite-lattice-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install --upgrade numpy
      - name: Run refinement audit
        run: python scripts/t020_gauge_covariant_q6_audit.py --n 2 3 > t020-audit.json
      - name: Check audit invariants and refinement trend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("t020-audit.json").read_text())
          rows = data["results"]
          assert len(rows) == 2
          for row in rows:
              assert row["wilson_nonnegative"]
              assert row["wilson_quadratic_form"] >= -1e-12
              assert row["wilson_identity_relative_residual"] < 1e-10
              assert row["wilson_imaginary_form_relative_residual"] < 1e-10
              assert row["gauge_covariance_relative_residual"] < 1e-10
              assert row["link_unitarity_max_residual"] < 1e-10
              assert row["link_det_one_max_residual"] < 1e-10
              assert row["nonabelian_generator_commutator_norm"] > 1e-6
              assert row["clifford_relations_max_residual"] < 1e-10
          assert rows[1]["consistency_error"] < rows[0]["consistency_error"], rows
          print(json.dumps(data, indent=2))
          PY
