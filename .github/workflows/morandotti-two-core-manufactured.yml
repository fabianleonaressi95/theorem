name: Morandotti two-core manufactured P3 C0-IPDG verification

on:
  push:
    branches:
      - 'work/rgs-defect-benchmark-torino'
    paths:
      - 'scripts/rgs_morandotti_two_core_manufactured.py'
      - '.github/workflows/morandotti-two-core-manufactured.yml'
  workflow_dispatch:

jobs:
  two-core-manufactured-p3:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Gmsh Python bindings
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libglu1-mesa
          python3 -m pip install --break-system-packages gmsh
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('Gmsh', gmsh.__version__)"
          python3 -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"
      - name: Run two-core manufactured-solution verification
        run: |
          python3 scripts/rgs_morandotti_two_core_manufactured.py --mesh-sizes 0.11 0.08 0.055 --alpha 10 --out artifacts/morandotti_two_core_manufactured/report.json
      - name: Upload manufactured-solution report
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-two-core-manufactured-p3-report
          path: artifacts/morandotti_two_core_manufactured/report.json
          if-no-files-found: error
