name: T136 exact design comparison

on:
  pull_request:
    paths:
      - "audits/t136_exact_design_comparison.py"
      - "audits/t136_nonquadratic_conformal.py"
      - "audits/t136_moment_design_optimization.py"
      - "audits/t136_scale_selection.py"
      - "tests/test_t136_exact_design_comparison.py"
      - ".github/workflows/t136-exact-design-comparison.yml"
  workflow_dispatch:

jobs:
  t136-exact-design:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade numpy
      - name: Run focused regression tests
        run: python -m unittest discover -s tests -p "test_t136_exact_design_comparison.py" -v
      - name: Run matched-budget numerical audit
        run: python audits/t136_exact_design_comparison.py > t136_exact_design_comparison.json
      - name: Upload numerical results
        uses: actions/upload-artifact@v4
        with:
          name: t136-exact-design-comparison
          path: t136_exact_design_comparison.json
