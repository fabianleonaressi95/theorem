name: MQM local PSU scalar field
on:
  push:
    paths:
      - 'models/mqm_local_scalar.py'
      - 'tests/test_mqm_local_scalar.py'
      - 'theorems/MQM1-local-psu-scalar-field.md'
      - '.github/workflows/mqm-local-psu-scalar.yml'
  pull_request:
    paths:
      - 'models/mqm_local_scalar.py'
      - 'tests/test_mqm_local_scalar.py'
      - 'theorems/MQM1-local-psu-scalar-field.md'
      - '.github/workflows/mqm-local-psu-scalar.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p test_mqm_local_scalar.py -v
