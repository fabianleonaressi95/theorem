name: Morandotti exact curved-P3 finite-mesh certificate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/certify_morandotti_curved_p3_mesh.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'models/morandotti_certified_rational_integration.py'
      - '.github/workflows/morandotti-trace-manual.yml'

permissions:
  contents: read

concurrency:
  group: morandotti-exact-certificate
  cancel-in-progress: true

jobs:
  exact-finite-mesh-certificate:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh, scipy; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__); print('SciPy', scipy.__version__)"
      - name: Assemble and certify the curved-P3 finite mesh
        run: |
          python3 scripts/certify_morandotti_curved_p3_mesh.py \
            --mesh-size 0.24 --distance 0.48 --seed 11 \
            --bound 20 --tolerance 1/1000 --max-depth 24 \
            --out artifacts/morandotti_trace_constant/exact_certificate.json
      - name: Upload exact finite-mesh certificate and phase timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-exact-curved-p3-certificate
          path: artifacts/morandotti_trace_constant/
          if-no-files-found: warn
          retention-days: 30
