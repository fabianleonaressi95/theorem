name: Morandotti T134 curved-P3 trace-constant sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_morandotti_curved_p3_trace_constant.py'
      - 'scripts/assemble_morandotti_trace_shards.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'models/morandotti_certified_rational_integration.py'
      - '.github/workflows/morandotti-trace-manual.yml'

permissions:
  contents: read

concurrency:
  group: morandotti-t134-trace-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fem-case:
    name: "Morandotti FEM d=${{ matrix.distance }}, h=${{ matrix.h }}, seed=${{ matrix.seed }}"
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { distance: 0.48, h: 0.08, seed: 11 }
          - { distance: 0.48, h: 0.08, seed: 29 }
          - { distance: 0.48, h: 0.08, seed: 47 }
          - { distance: 0.48, h: 0.045, seed: 11 }
          - { distance: 0.48, h: 0.045, seed: 29 }
          - { distance: 0.48, h: 0.045, seed: 47 }
          - { distance: 0.56, h: 0.08, seed: 11 }
          - { distance: 0.56, h: 0.08, seed: 29 }
          - { distance: 0.56, h: 0.08, seed: 47 }
          - { distance: 0.56, h: 0.045, seed: 11 }
          - { distance: 0.56, h: 0.045, seed: 29 }
          - { distance: 0.56, h: 0.045, seed: 47 }
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: python3 -c "import dolfinx, ufl, petsc4py, gmsh, scipy; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__); print('SciPy', scipy.__version__)"
      - name: Execute one independent FEM realization
        run: |
          mkdir -p "artifacts/morandotti_trace_constant/case-${{ matrix.distance }}-${{ matrix.h }}-${{ matrix.seed }}"
          python3 scripts/audit_morandotti_curved_p3_trace_constant.py \
            --mesh-sizes "${{ matrix.h }}" \
            --distances "${{ matrix.distance }}" \
            --seeds "${{ matrix.seed }}" \
            --skip-statistical \
            --out "artifacts/morandotti_trace_constant/case-${{ matrix.distance }}-${{ matrix.h }}-${{ matrix.seed }}/report.json" \
            --certificate-out "artifacts/morandotti_trace_constant/case-${{ matrix.distance }}-${{ matrix.h }}-${{ matrix.seed }}/cell-certificates.jsonl.gz"
      - name: Upload independent FEM result and exact cell certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-t134-case-d${{ matrix.distance }}-h${{ matrix.h }}-s${{ matrix.seed }}
          path: artifacts/morandotti_trace_constant/case-${{ matrix.distance }}-${{ matrix.h }}-${{ matrix.seed }}/
          if-no-files-found: error
          retention-days: 30

  assemble-sweep:
    name: Assemble all 12 FEM cases and run global statistics
    needs: fem-case
    if: always() && needs.fem-case.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all independent FEM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: morandotti-t134-case-*
          path: shards
          merge-multiple: false
      - name: Validate complete sweep and assemble statistical report
        run: |
          python3 scripts/assemble_morandotti_trace_shards.py \
            --shards shards --out artifacts/morandotti_trace_constant \
            --bootstrap-replicates 2000
      - name: Upload complete sweep certificate
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-t134-complete-sweep
          path: artifacts/morandotti_trace_constant/
          if-no-files-found: error
          retention-days: 90
