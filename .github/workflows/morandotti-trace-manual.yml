
name: Morandotti trace-constant manual audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-constant:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh, scipy; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__); print('SciPy', scipy.__version__)"

      - name: Run generalized-eigenvalue unit tests
        run: python3 -m pytest -q tests/test_morandotti_trace_constant.py

      - name: Run curved P3 FEM audit
        run: |
          python3 scripts/audit_morandotti_curved_p3_trace_constant.py \
            --mesh-sizes 0.08 0.045 \
            --distances 0.48 0.56 \
            --seeds 11 29 47 \
            --out artifacts/morandotti_trace_constant/report.json

      - name: Upload FEM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-trace-constant-report
          path: artifacts/morandotti_trace_constant/
          if-no-files-found: warn
