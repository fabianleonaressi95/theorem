name: Q6-D5 integer-fiber exact audit
on:
  pull_request:
    paths:
      - "src/rgs_q6_*.py"
      - "tests/test_rgs_q6_d5_*.py"
      - "scripts/run_q6_d5_*.py"
      - "requirements-audit.txt"
      - ".github/workflows/q6-d5-integer-fiber.yml"
  push:
    branches: [main]
    paths:
      - "src/rgs_q6_*.py"
      - "tests/test_rgs_q6_d5_*.py"
      - "scripts/run_q6_d5_*.py"
      - "requirements-audit.txt"
      - ".github/workflows/q6-d5-integer-fiber.yml"
jobs:
  exact-integer-fiber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install -r requirements-audit.txt
      - name: Compile Q6-D5 modules
        run: python -m compileall -q src/rgs_q6_equivariant_cochains.py src/rgs_q6_euclidean_time_wilson.py src/rgs_q6_u1_character_electric_flux.py src/rgs_q6_u1_transfer_operator.py src/rgs_q6_d5_integer_fiber_quotient.py src/rgs_q6_d5_fiber_bessel_majorant.py src/rgs_q6_d5_saturated_kernel_bounds.py src/rgs_q6_d5_gaussian_poisson.py
      - name: Run focused exact-arithmetic tests
        run: python -m pytest -q tests/test_rgs_q6_d5_integer_fiber_quotient.py tests/test_rgs_q6_d5_fiber_bessel_majorant.py tests/test_rgs_q6_d5_saturated_kernel_bounds.py tests/test_rgs_q6_d5_gaussian_poisson.py
      - name: Generate reproducible splitting and tail report
        run: python scripts/run_q6_d5_saturated_kernel_bounds.py --beta-time 2.0 --edge-l1-cutoff 500 --output reports/q6_d5_saturated_kernel_bounds.json
      - name: Upload exact-arithmetic audit report
        uses: actions/upload-artifact@v4
        with:
          name: q6-d5-saturated-kernel-audit
          path: reports/q6_d5_saturated_kernel_bounds.json
          if-no-files-found: error
