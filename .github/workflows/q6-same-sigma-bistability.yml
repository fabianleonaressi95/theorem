name: Q6 same-sigma multistart bistability

on:
  push:
    branches: [work/rgs-defect-benchmark-torino]
    paths:
      - "scripts/run_q6_same_sigma_multistart_bistability.py"
      - "models/q6_topological_synchronization.py"
      - ".github/workflows/q6-same-sigma-bistability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multistart:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run same-sigma multistart test
        run: |
          python scripts/run_q6_same_sigma_multistart_bistability.py \
            --sigmas 0.75,1.0,1.25,1.5,1.75,2.0 \
            --dwells 2560,10240 \
            --phase-seeds 11,23,37,51,67,79,97,109 \
            --frequency-seed 20261109 \
            --dt 0.025 \
            --output artifacts/q6_same_sigma_multistart.json
      - name: Upload numerical report
        uses: actions/upload-artifact@v4
        with:
          name: q6-same-sigma-multistart
          path: artifacts/q6_same_sigma_multistart.json
          if-no-files-found: error
