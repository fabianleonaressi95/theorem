name: MQM multidimensional analysis
on:
  push:
    paths:
      - 'models/mqm_multidimensional.py'
      - 'tests/test_mqm_multidimensional.py'
      - 'theorems/MQM-multidimensional-structure.md'
      - '.github/workflows/mqm-multidimensional.yml'
  pull_request:
    paths:
      - 'models/mqm_multidimensional.py'
      - 'tests/test_mqm_multidimensional.py'
      - 'theorems/MQM-multidimensional-structure.md'
      - '.github/workflows/mqm-multidimensional.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p test_mqm_multidimensional.py -v
