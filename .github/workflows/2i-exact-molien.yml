name: 2I exact Molien audit

on:
  push:
    branches:
      - main
      - "research/2i-molien-exact-degree-240"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-molien:
    name: Exact Q(sqrt(5)) Molien audit (degrees 0-240)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact group and Molien regression tests
        run: python -m pytest -q tests/test_2i_real_molien_exact.py
