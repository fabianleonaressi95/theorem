name: de Rham benchmark smoke checks

on:
  push:
    branches: [main]
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/de-rham-benchmark.yml"
  pull_request:
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/de-rham-benchmark.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/de_rham_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ddr run_benchmark.py diagnose_pollution.py degreewise_audit.py ddr/feec_mass.py compare_mass_matrices.py mass_refinement_study.py test_consistent_mass.py audits tests
        run: python -m compileall -q ddr run_benchmark.py diagnose_pollution.py degreewise_audit.py ddr/feec_mass.py ddr/kforms.py ddr/test_forms.py ddr/feec_study.py compare_mass_matrices.py mass_refinement_study.py test_consistent_mass.py test_feec_study.py run_feec_study.py audits tests
      - name: Run Herasymov symbolic and parity-lattice audit
        run: |
          python audits/audit_herasymov_symbolic.py --self-test --output /tmp/herasymov-audit.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/herasymov-audit.json'))
          assert data['self_test'] == 'PASS'
          assert data['finite_shuffle_billiard_identity']['matches'] == 65536
          assert data['parity_lattice_uniform_rules']['single_parent_source_coordinate_per_parent']
          assert not data['parity_lattice_mixed_rules']['single_parent_source_coordinate_per_parent']
          rotation = data['rotation_generator']
          assert rotation['modes_exhausted'] == 256
          assert rotation['all_coordinate_maps_bijective']
          assert rotation['distinct_coordinate_maps'] == 32
          assert rotation['orientation_counts_over_modes'] == {'+1': 128, '-1': 128}
          assert rotation['scalar_action_counts'] == {'increment': 128, 'unchanged': 128}
          assert data['rotation_parity_uniform_rules']['single_parent_sample_rule']
          assert not data['rotation_parity_mixed_rules']['single_parent_sample_rule']
          print('Herasymov finite, Boolean parity, and rotation-mode controls passed')
          assert rotation['bit3_preserves_coordinates']
          assert rotation['bit3_toggles_increment_rule']
          assert data['rotation_parity_uniform_rules']['single_parent_sample_rule']
          assert not data['rotation_parity_mixed_rules']['single_parent_sample_rule']
          chain = data['uniform_cubical_chain_maps']
          assert chain['distinct_signed_permutation_maps'] == 32
          assert chain['chain_map_identity_holds']
          assert sum(chain['orientation_determinants'].values()) == 32
          assert all(v > 0 for v in chain['orientation_determinants'].values())
          print('Herasymov symbolic, rotation, and cubical chain-map controls passed')
          PY
      - name: Run Herasymov regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_herasymov_symbolic_audit.py
          python -m pytest -q tests/test_cubical_subdivision_chain_map.py
          python -m pytest -q tests/test_herasymov_parity_face_conformity.py
      - name: Audit exact Herasymov parity shared-face conformity
        run: python audits/audit_herasymov_parity_face_conformity.py --self-test
      - name: Audit exact cubical subdivision and symmetry naturality
        run: python audits/audit_cubical_subdivision_chain_map.py --size 2
      - name: Check CLI entry point
        run: python run_benchmark.py --help
      - name: Verify cubical incidence chain identity
        run: |
          python - <<'PY'
          import numpy as np
          from ddr.mesh import CubicalMesh
          for dim, n in ((2, 2), (3, 2)):
              mesh = CubicalMesh(n, dim)
              # mesh stores coboundary matrices in mesh.d
              for k in range(dim - 1):
                  residual = mesh.dmat[k + 1] @ mesh.dmat[k]
                  assert residual.nnz == 0 or np.max(np.abs(residual.data)) == 0
          print("d_(k+1) d_k = 0: exact sparse identity")
          PY

      - name: Audit all Hodge degrees on small affine meshes
        run: |
          python degreewise_audit.py --dim 2 --N 4 > /tmp/audit2d.json
          python degreewise_audit.py --dim 3 --N 3 > /tmp/audit3d.json
          python - <<'PY'
          import json
          for path, k in (("/tmp/audit2d.json", 1), ("/tmp/audit3d.json", 2)):
              data = json.load(open(path))
              # These are the co-closed, curl-dominated sectors.
              for pair in data["degrees"][k]["eigenpairs"]:
                  if pair["lambda"] > 1e-9:
                      assert pair["normalized_co_closedness_defect"] < 1e-7
                      assert pair["curl_energy_fraction"] > 1.0 - 1e-8
              # The top degree has no outgoing differential: positive
              # modes are grad-only and cannot be co-closed.
              for pair in data["degrees"][-1]["eigenpairs"]:
                  if pair["lambda"] > 1e-9:
                      assert abs(pair["grad_energy_fraction"] - 1.0) < 1e-8
                      assert pair["curl_energy_fraction"] < 1e-8
                      assert abs(pair["normalized_co_closedness_defect"] - 1.0) < 1e-8
          print("co-closed sectors and top-degree sectors distinguished")
          PY

      - name: Compare diagonal DEC and consistent cubical FEEC masses
        run: python test_consistent_mass.py

      - name: Run DEC versus consistent FEEC refinement controls
        run: |
          python mass_refinement_study.py --dim 2 --levels 4,8,16 --out /tmp/mass2d.json
          python mass_refinement_study.py --dim 3 --levels 2,3,4,5 --out /tmp/mass3d.json
          python - <<'PY'
          import json
          for path in ("/tmp/mass2d.json", "/tmp/mass3d.json"):
              data = json.load(open(path))
              print(json.dumps({
                  "dimension": data["dimension"],
                  "rows": data["rows"],
                  "empirical_loglog_exponents": data["empirical_loglog_exponents"],
              }, indent=2))
          PY

      - name: FEEC projection and adjoint smoke tests
        run: |
          python test_feec_study.py
          python run_feec_study.py configs/feec_smoke.json --out /tmp/feec_smoke
          python - <<'PY'
          import json
          data = json.load(open("/tmp/feec_smoke/feec_results.json"))
          for case in data["cases"]:
              for level in case["levels"]:
                  assert level["geometry_checks"]["face_conformity_ok"]
                  assert level["geometry_checks"]["min_det_jac"] > 0
                  for k, forms in level["forms"].items():
                      for f in forms:
                          if "commutator" in f:
                              assert f["commutator"]["rel_inf_residual"] < 1e-8
          print("FEEC study smoke run ok")
          PY

      - name: Run fixed-amplitude curved-map mass controls
        run: |
          python mass_refinement_study.py --dim 2 --levels 4,8,16 --amplitude 0.05 --out /tmp/curved2d.json
          python mass_refinement_study.py --dim 3 --levels 2,3,4 --amplitude 0.05 --out /tmp/curved3d.json
          python - <<'PY'
          import json
          for path in ("/tmp/curved2d.json", "/tmp/curved3d.json"):
              data = json.load(open(path))
              assert all(row["min_det_jac"] > 0 for row in data["rows"])
              print(json.dumps({
                  "dimension": data["dimension"],
                  "rows": data["rows"],
                  "empirical_loglog_exponents": data["empirical_loglog_exponents"],
              }, indent=2))
          PY
