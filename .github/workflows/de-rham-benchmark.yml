name: de Rham benchmark smoke checks

on:
  push:
    branches: [main]
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/de-rham-benchmark.yml"
  pull_request:
    paths:
      - "projects/de_rham_benchmark/**"
      - ".github/workflows/de-rham-benchmark.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/de_rham_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ddr run_benchmark.py diagnose_pollution.py
      - name: Check CLI entry point
        run: python run_benchmark.py --help
      - name: Verify cubical incidence chain identity
        run: |
          python - <<'PY'
          import numpy as np
          from ddr.mesh import CubicalMesh
          for dim, n in ((2, 2), (3, 2)):
              mesh = CubicalMesh(n, dim)
              # mesh stores coboundary matrices in mesh.d
              for k in range(dim - 1):
                  residual = mesh.dmat[k + 1] @ mesh.dmat[k]
                  assert residual.nnz == 0 or np.max(np.abs(residual.data)) == 0
          print("d_(k+1) d_k = 0: exact sparse identity")
          PY

      - name: Audit all Hodge degrees on small affine meshes
        run: |
          python degreewise_audit.py --dim 2 --N 4 > /tmp/audit2d.json
          python degreewise_audit.py --dim 3 --N 3 > /tmp/audit3d.json
          python - <<'PY'
          import json
          for path in ("/tmp/audit2d.json", "/tmp/audit3d.json"):
              data = json.load(open(path))
              top = data["degrees"][-1]
              for pair in top["eigenpairs"]:
                  if pair["lambda"] > 1e-9:
                      assert abs(pair["grad_energy_fraction"] - 1.0) < 1e-8
                      assert pair["curl_energy_fraction"] < 1e-8
                      assert abs(pair["normalized_co_closedness_defect"] - 1.0) < 1e-8
          print("top-degree positive modes: grad-only, not co-closed")
          PY
