name: T112 golden KTHNY geometry audit

on:
  push:
    paths:
      - "scripts/audit_t112_golden_kthny.py"
      - "tests/test_t112_golden_kthny.py"
      - ".github/workflows/t112-golden-kthny.yml"
  pull_request:
    paths:
      - "scripts/audit_t112_golden_kthny.py"
      - "tests/test_t112_golden_kthny.py"
      - ".github/workflows/t112-golden-kthny.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - run: python -m pytest -q tests/test_t112_golden_kthny.py
      - run: python scripts/audit_t112_golden_kthny.py --n-max 12
