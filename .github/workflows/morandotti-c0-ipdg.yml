name: Morandotti P3 C0-IPDG reproduction

on:
  push:
    branches:
      - 'work/rgs-defect-benchmark-torino'
    paths:
      - 'scripts/rgs_morandotti_c0_ipdg.py'
      - '.github/workflows/morandotti-c0-ipdg.yml'
  workflow_dispatch:

jobs:
  single-core-p3-c0-ipdg:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Gmsh Python bindings
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libglu1-mesa
          python3 -m pip install --break-system-packages gmsh
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('Gmsh', gmsh.__version__)"
          python3 -c "from petsc4py import PETSc; print('PETSc', PETSc.Sys.getVersion())"
      - name: Run single-core P3 C0-IPDG reproduction
        run: |
          python3 scripts/rgs_morandotti_c0_ipdg.py --mesh-sizes 0.22 0.14 0.09 0.06 --alpha 10 --out artifacts/morandotti_c0_ipdg/report.json
      - name: Upload P3 C0-IPDG report
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-p3-c0-ipdg-report
          path: artifacts/morandotti_c0_ipdg/report.json
          if-no-files-found: error
