name: Morandotti curved-P3 trace-constant audit

on:
  push:
    branches: [main, t134-interior-facet-weight-fix]
    paths:
      - 'scripts/certify_morandotti_curved_p3_mesh.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'models/morandotti_trace_constant.py'
      - 'models/morandotti_exact_geometry.py'
      - 'models/morandotti_exact_integration.py'
      - 'models/morandotti_certified_rational_integration.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'models/morandotti_direct_ipdg_certificate.py'
      - 'scripts/certify_morandotti_direct_ipdg.py'
      - 'tests/test_morandotti_direct_ipdg_certificate.py'
      - 'tests/test_morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_rational_integration.py'
      - 'tests/test_morandotti_trace_constant.py'
      - 'tests/test_morandotti_exact_geometry.py'
      - 'tests/test_morandotti_exact_integration.py'
      - '.github/workflows/morandotti-trace-constant.yml'
  workflow_dispatch:
    inputs:
      mesh_size:
        description: "Target mesh size (single mesh only)"
        required: true
        default: "0.30"
        type: string
      distance:
        description: "Distance between the two cores"
        required: true
        default: "0.48"
        type: string
      seed:
        description: "Mesh random seed"
        required: true
        default: "11"
        type: string
      alpha:
        description: "IPDG penalty parameter"
        required: true
        default: "40"
        type: string
      kappa:
        description: "Coercivity margin"
        required: true
        default: "1/1000"
        type: string
      tolerance:
        description: "Absolute integration tolerance"
        required: true
        default: "1/10000"
        type: string
  pull_request:
    branches: [main, t134-exact-integration-foundation]
    paths:
      - 'scripts/certify_morandotti_curved_p3_mesh.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'models/morandotti_trace_constant.py'
      - 'models/morandotti_exact_geometry.py'
      - 'models/morandotti_exact_integration.py'
      - 'models/morandotti_certified_rational_integration.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'models/morandotti_direct_ipdg_certificate.py'
      - 'scripts/certify_morandotti_direct_ipdg.py'
      - 'tests/test_morandotti_direct_ipdg_certificate.py'
      - 'tests/test_morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_rational_integration.py'
      - 'tests/test_morandotti_trace_constant.py'
      - 'tests/test_morandotti_exact_geometry.py'
      - 'tests/test_morandotti_exact_integration.py'

concurrency:
  group: morandotti-trace-constant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace-constant:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh, scipy; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__); print('SciPy', scipy.__version__)"
      - name: Run generalized-eigenvalue and exact/certified-integration unit tests
        run: python3 -m pytest -q tests/test_morandotti_trace_constant.py tests/test_morandotti_exact_geometry.py tests/test_morandotti_exact_integration.py tests/test_morandotti_certified_rational_integration.py
      - name: Run certified curved-P3 local form assembly tests
        run: python3 -m pytest -q tests/test_morandotti_certified_curved_p3_forms.py
      - name: Compile direct certificate module and runner
        run: python3 -m py_compile models/morandotti_direct_ipdg_certificate.py scripts/certify_morandotti_direct_ipdg.py
      - name: Run direct interval IPDG assembly and strict coercivity tests
        run: python3 -m pytest -q tests/test_morandotti_direct_ipdg_certificate.py
      - name: Run one-mesh direct interval IPDG certificate
        if: github.event_name == 'workflow_dispatch'
        env:
          MESH_SIZE: ${{ inputs.mesh_size }}
          DISTANCE: ${{ inputs.distance }}
          SEED: ${{ inputs.seed }}
          ALPHA: ${{ inputs.alpha }}
          KAPPA: ${{ inputs.kappa }}
          TOLERANCE: ${{ inputs.tolerance }}
        run: |
          python3 scripts/certify_morandotti_direct_ipdg.py \\
            --mesh-size "$MESH_SIZE" \\
            --distance "$DISTANCE" \\
            --seed "$SEED" \\
            --alpha "$ALPHA" \\
            --kappa "$KAPPA" \\
            --tolerance "$TOLERANCE" \\
            --max-depth 24
      - name: Upload fixed-mesh certificate and diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: t134-direct-ipdg-certificate
          path: artifacts/morandotti_direct_ipdg/direct_coercivity.json
          if-no-files-found: warn


