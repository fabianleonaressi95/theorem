name: Morandotti curved-P3 trace-constant audit

on:
  push:
    branches: [main]
    paths:
      - 'models/morandotti_trace_constant.py'
      - 'models/morandotti_exact_geometry.py'
      - 'models/morandotti_exact_integration.py'
      - 'models/morandotti_certified_rational_integration.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_rational_integration.py'
      - 'tests/test_morandotti_trace_constant.py'
      - 'tests/test_morandotti_exact_geometry.py'
      - 'tests/test_morandotti_exact_integration.py'
  pull_request:
    branches: [main]
    paths:
      - 'models/morandotti_trace_constant.py'
      - 'models/morandotti_exact_geometry.py'
      - 'models/morandotti_exact_integration.py'
      - 'models/morandotti_certified_rational_integration.py'
      - 'models/morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_curved_p3_forms.py'
      - 'tests/test_morandotti_certified_rational_integration.py'
      - 'tests/test_morandotti_trace_constant.py'
      - 'tests/test_morandotti_exact_geometry.py'
      - 'tests/test_morandotti_exact_integration.py'

concurrency:
  group: morandotti-trace-constant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace-constant:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh, scipy; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__); print('SciPy', scipy.__version__)"
      - name: Run generalized-eigenvalue and exact/certified-integration unit tests
        run: python3 -m pytest -q tests/test_morandotti_trace_constant.py tests/test_morandotti_exact_geometry.py tests/test_morandotti_exact_integration.py tests/test_morandotti_certified_rational_integration.py
      - name: Run certified curved-P3 local form assembly tests
        run: python3 -m pytest -q tests/test_morandotti_certified_curved_p3_forms.py
      - name: Stop after fast unit tests
        run: echo "Full exact-mesh certification is manual; see morandotti-trace-manual.yml"
