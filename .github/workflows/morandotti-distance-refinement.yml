name: Morandotti mesh-refined core-separation audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/morandotti_distance_refinement.py'
      - 'scripts/rgs_morandotti_distance_refinement.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'tests/test_morandotti_distance_refinement.py'
      - '.github/workflows/morandotti-distance-refinement.yml'
  push:
    branches: [main]
    paths:
      - 'models/morandotti_distance_refinement.py'
      - 'scripts/rgs_morandotti_distance_refinement.py'
      - 'scripts/rgs_morandotti_two_core_c0_ipdg.py'
      - 'tests/test_morandotti_distance_refinement.py'
      - '.github/workflows/morandotti-distance-refinement.yml'

permissions:
  contents: read

jobs:
  distance-refinement:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/dolfinx:v0.11.0
      options: --user root
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify numerical environment
        run: |
          python3 -c "import dolfinx, ufl, petsc4py, gmsh; print('DOLFINx', dolfinx.__version__); print('UFL', ufl.__version__); print('PETSc', petsc4py.__version__); print('Gmsh', gmsh.__version__)"
      - name: Run pure post-processing tests
        run: python3 -m pytest -q tests/test_morandotti_distance_refinement.py
      - name: Run mesh-refined distance sweep
        run: |
          python3 scripts/rgs_morandotti_distance_refinement.py \
            --mesh-sizes 0.08 0.06 0.045 \
            --distance-values 0.48 0.56 0.64 0.72 \
            --alpha 10 \
            --young-modulus 1.0 \
            --poisson-ratio 0.0 \
            --out artifacts/morandotti_distance_refinement/report.json
      - name: Upload report and finite-element fields
        uses: actions/upload-artifact@v4
        with:
          name: morandotti-distance-refinement
          path: artifacts/morandotti_distance_refinement/
          if-no-files-found: error
          retention-days: 14
