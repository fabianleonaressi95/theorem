name: T160 covariant-gradient Galerkin audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_t160_covariant_gradient_energy.py"
      - "tests/test_t160_covariant_gradient_energy.py"
      - "theorems/T160-covariant-gradient-galerkin.md"
      - ".github/workflows/t160-covariant-gradient-energy.yml"
  pull_request:
    paths:
      - "scripts/audit_t160_covariant_gradient_energy.py"
      - "tests/test_t160_covariant_gradient_energy.py"
      - "theorems/T160-covariant-gradient-galerkin.md"
      - ".github/workflows/t160-covariant-gradient-energy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  covariant-gradient-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python scripts/audit_t160_covariant_gradient_energy.py
      - run: python -m unittest tests.test_t160_covariant_gradient_energy
      - uses: actions/upload-artifact@v4
        with:
          name: t160-covariant-gradient-energy
          path: results/json/t160_covariant_gradient_energy.json
          retention-days: 30
